<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QMines Drillhole Database</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-card">
    <div class="core-strip" aria-hidden="true"></div>
    <h1>QMines<span class="dot">.</span></h1>
    <p class="login-sub">Drillhole Database</p>
    <form id="login-form">
      <label for="login-email">Email</label>
      <input id="login-email" type="email" autocomplete="username" required>
      <label for="login-password">Password</label>
      <input id="login-password" type="password" autocomplete="current-password" required>
      <button type="submit" id="login-btn">Sign in</button>
      <p id="login-error" class="login-error" role="alert"></p>
    </form>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">QMines<span class="dot">.</span></span>
      <span class="brand-sub">Drillhole Database</span>
    </div>
    <nav class="views" role="tablist">
      <button class="view-tab active" data-view="map" role="tab">Map</button>
      <button class="view-tab" data-view="data" role="tab">Data</button>
    </nav>
    <div class="user-area">
      <span id="user-email" class="user-email"></span>
      <button id="logout-btn" class="ghost-btn">Sign out</button>
    </div>
  </header>
  <div class="core-strip" aria-hidden="true"></div>

  <!-- ---------- MAP VIEW ---------- -->
  <main id="view-map" class="view active">
    <aside class="map-panel">
      <h2>Layers</h2>
      <div class="filter-group">
        <span class="filter-label">Projects</span>
        <label class="chk"><input type="checkbox" class="f-project" value="Mt Chalmers" checked><span class="swatch sw-mc"></span>Mt Chalmers</label>
        <label class="chk"><input type="checkbox" class="f-project" value="Develin Creek" checked><span class="swatch sw-dc"></span>Develin Creek</label>
        <label class="chk"><input type="checkbox" class="f-project" value="Mt Mackenzie" checked><span class="swatch sw-mm"></span>Mt Mackenzie</label>
      </div>
      <div class="filter-group">
        <span class="filter-label">Data source</span>
        <label class="chk"><input type="checkbox" class="f-source" value="QMines" checked>QMines drilling</label>
        <label class="chk"><input type="checkbox" class="f-source" value="Historical" checked>Historical</label>
      </div>
      <div class="filter-group">
        <span class="filter-label">Overlays</span>
        <label class="chk"><input type="checkbox" id="f-tenements" checked>Tenement boundaries</label>
        <label class="chk"><input type="checkbox" id="f-planned-only">Planned coordinates only</label>
      </div>
      <div class="filter-group">
        <span class="filter-label">Basemap</span>
        <label class="chk"><input type="radio" name="basemap" value="satellite" checked>Satellite</label>
        <label class="chk"><input type="radio" name="basemap" value="street">Street</label>
      </div>
      <p class="map-count" id="map-count">Loading holes\u2026</p>
      <p class="legend-note">Dashed outline = collar not yet survey picked-up (planned position)</p>
    </aside>
    <div id="map" class="map"></div>
  </main>

  <!-- ---------- DATA VIEW ---------- -->
  <main id="view-data" class="view">
    <aside class="data-panel">
      <h2>Dataset</h2>
      <select id="table-select" aria-label="Dataset">
        <option value="collars">Collars</option>
        <option value="samples_assays">Samples &amp; Assays</option>
        <option value="lithology_qmines">Lithology — QMines</option>
        <option value="lithology_historical">Lithology — Historical</option>
        <option value="survey">Downhole Surveys</option>
        <option value="rqd">RQD</option>
        <option value="sg">Specific Gravity</option>
        <option value="structure">Structure</option>
        <option value="assay_results_by_method">Assays by Method</option>
        <option value="tenements">Tenements</option>
      </select>

      <h2>Filters</h2>
      <div class="filter-group" id="fg-project">
        <label class="filter-label" for="d-project">Project</label>
        <select id="d-project"><option value="">All projects</option>
          <option>Mt Chalmers</option><option>Develin Creek</option><option>Mt Mackenzie</option>
        </select>
      </div>
      <div class="filter-group" id="fg-prospect">
        <label class="filter-label" for="d-prospect">Prospect</label>
        <select id="d-prospect"><option value="">All prospects</option></select>
      </div>
      <div class="filter-group" id="fg-source">
        <label class="filter-label" for="d-source">Data source</label>
        <select id="d-source"><option value="">All</option><option>QMines</option><option>Historical</option></select>
      </div>
      <div class="filter-group" id="fg-hole">
        <label class="filter-label" for="d-hole">Hole ID contains</label>
        <input id="d-hole" type="text" placeholder="e.g. MCDD" spellcheck="false">
      </div>
      <div class="filter-group" id="fg-priority">
        <label class="filter-label" for="d-priority">Sample priority</label>
        <select id="d-priority">
          <option value="">All samples</option>
          <option value="1">1 — Primary</option>
          <option value="2">2 — QAQC standards/blanks</option>
          <option value="3">3 — QAQC duplicates</option>
        </select>
      </div>
      <button id="apply-btn" class="solid-btn">Apply filters</button>
      <button id="export-btn" class="outline-btn">Download CSV</button>
      <p class="export-note" id="export-note"></p>
    </aside>

    <section class="data-main">
      <div class="data-status">
        <span id="row-count">—</span>
        <div class="pager">
          <button id="prev-btn" class="ghost-btn" disabled>&larr; Prev</button>
          <span id="page-label">Page 1</span>
          <button id="next-btn" class="ghost-btn" disabled>Next &rarr;</button>
        </div>
      </div>
      <div class="table-wrap" id="table-wrap" tabindex="0">
        <table id="data-table"><thead></thead><tbody></tbody></table>
      </div>
    </section>
  </main>
</div>

<div id="loading-overlay" class="loading-overlay hidden"><div class="spinner"></div><p id="loading-text">Working\u2026</p></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
